<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>לומדים אנגלית – Let's Learn English!</title>
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&family=Varela+Round&display=swap" rel="stylesheet">
<style>
:root{
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
  --ink:#16213e; --paper:#fffdf6; --on-tone:#16213e; --muted:#3d4a72;
  --t-animals:#ff9f43; --t-colors:#b79cff; --t-numbers:#5cc8ff; --t-fruits:#7ed957;
  --good:#1fa365; --bad:#e8505b;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --on-tone:#fffdf6; --muted:#e3e8ff;
    --t-animals:#a85a14; --t-colors:#5a44a6; --t-numbers:#1d6a94; --t-fruits:#2c7a28;
  }
}
:root[data-theme="dark"]{
  --on-tone:#fffdf6; --muted:#e3e8ff;
  --t-animals:#a85a14; --t-colors:#5a44a6; --t-numbers:#1d6a94; --t-fruits:#2c7a28;
}
*,*::before,*::after{box-sizing:inherit}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
html,body{margin:0}
body{
  --tone:var(--t-animals);
  background:var(--tone); color:var(--on-tone);
  font-family:"Varela Round","Fredoka",system-ui,sans-serif;
  min-height:100vh; transition:background-color .4s;
  padding-bottom:120px;
}
body[data-topic="colors"]{--tone:var(--t-colors)}
body[data-topic="numbers"]{--tone:var(--t-numbers)}
body[data-topic="fruits"]{--tone:var(--t-fruits)}
button{font:inherit;color:var(--ink);cursor:pointer;-webkit-tap-highlight-color:transparent}
:focus-visible{outline:4px solid var(--ink);outline-offset:3px}
.en{font-family:"Fredoka","Varela Round",system-ui,sans-serif;direction:ltr}

main{max-width:560px;margin:0 auto;padding:14px 16px 0}
header{display:flex;align-items:center;justify-content:space-between;gap:10px}
header h1{margin:0;font-size:1.25rem;font-weight:700}
.seg{display:flex;background:var(--paper);border:3px solid var(--ink);border-radius:999px;padding:3px;gap:2px}
.seg button{border:0;background:none;border-radius:999px;padding:5px 14px;font-size:1rem}
.seg button[aria-pressed="true"]{background:var(--ink);color:var(--paper)}

.stage{margin-top:18px;display:grid;grid-template-columns:auto 1fr auto;align-items:center;gap:8px;direction:ltr}
.arrow{width:52px;height:52px;border-radius:50%;border:3px solid var(--ink);background:var(--paper);font-size:1.4rem;box-shadow:0 4px 0 var(--ink)}
.arrow:active{transform:translateY(3px);box-shadow:0 1px 0 var(--ink)}
.sticker{
  background:var(--paper);border:4px solid var(--ink);border-radius:34px;
  box-shadow:0 8px 0 var(--ink);
  aspect-ratio:1/1;display:grid;place-items:center;
  font-size:clamp(6.5rem,34vw,10rem);line-height:1;
  transform:rotate(-2deg);
}
.sticker.pop{animation:pop .45s cubic-bezier(.3,1.6,.5,1)}
@keyframes pop{from{transform:rotate(-8deg) scale(.7)}to{transform:rotate(-2deg) scale(1)}}
.dot{display:block;width:.62em;height:.62em;border-radius:50%;border:5px solid var(--ink)}
.digit{font-family:"Fredoka",sans-serif;font-weight:700;color:var(--ink)}

.blocks{display:flex;justify-content:center;flex-wrap:wrap;gap:8px;margin:26px 0 6px;direction:ltr;border:0;background:none;width:100%;padding:0}
.blocks span{
  min-width:1.5em;padding:.05em .18em;background:var(--paper);color:var(--ink);
  border:3px solid var(--ink);border-radius:14px;box-shadow:0 5px 0 var(--ink);
  font-family:"Fredoka",sans-serif;font-weight:700;font-size:clamp(2.4rem,11vw,3.6rem);line-height:1.25;text-align:center;
}
.blocks span:nth-child(odd){transform:rotate(-3deg)}
.blocks span:nth-child(even){transform:rotate(2.5deg) translateY(2px)}
.he{text-align:center;font-size:1.5rem;margin:12px 0 0}
.count{text-align:center;color:var(--muted);margin-top:6px;direction:ltr}

.opts{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin-top:20px;direction:ltr}
.opt{
  aspect-ratio:1/1;background:var(--paper);border:4px solid var(--ink);border-radius:26px;box-shadow:0 6px 0 var(--ink);
  font-size:clamp(3rem,15vw,4.8rem);line-height:1;display:grid;place-items:center;padding:0;
}
.opt:nth-child(1){transform:rotate(-2deg)} .opt:nth-child(2){transform:rotate(1.5deg)} .opt:nth-child(3){transform:rotate(-1deg)}
.opt .dot{border-width:4px}
.opt.ok{background:var(--good)}
.opt.no{animation:shake .35s;background:#ffd6d9}
@keyframes shake{25%{translate:-7px 0}75%{translate:7px 0}}
.ask{display:flex;justify-content:center;margin-top:22px}
.say{background:var(--paper);border:4px solid var(--ink);border-radius:999px;padding:10px 30px;font-size:1.5rem;box-shadow:0 5px 0 var(--ink);font-family:"Fredoka",sans-serif;font-weight:600}
.say:active{transform:translateY(4px);box-shadow:0 1px 0 var(--ink)}
.msg{text-align:center;min-height:2.2em;margin:16px 0 0;font-size:1.6rem;font-family:"Fredoka",sans-serif;font-weight:600;direction:ltr}
.stars{display:flex;justify-content:center;gap:6px;margin-top:6px;font-size:2rem;direction:ltr}
.stars i{font-style:normal;filter:grayscale(1) opacity(.45)}
.stars i.on{filter:none}
.hide{display:none!important}

nav{
  position:fixed;left:0;right:0;bottom:0;z-index:5;
  background:var(--paper);border-top:4px solid var(--ink);
  padding:10px 8px calc(10px + env(safe-area-inset-bottom,0px));
  display:flex;justify-content:center;gap:10px;
}
nav button{
  flex:1;max-width:120px;display:flex;flex-direction:column;align-items:center;gap:2px;
  background:none;border:3px solid transparent;border-radius:20px;padding:6px 4px;font-size:.95rem;
}
nav button b{font-size:1.9rem;font-weight:400;line-height:1.1}
nav button[aria-pressed="true"]{background:var(--tone);border-color:var(--ink);box-shadow:0 4px 0 var(--ink);transform:translateY(-6px)}
nav button[aria-pressed="true"]{color:var(--ink)}
.tip{text-align:center;font-size:.9rem;color:var(--muted);margin:26px 0 0}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body data-topic="animals">
<main>
  <header>
    <h1 class="en">Let's Learn English!</h1>
    <div class="seg" role="group" aria-label="מצב">
      <button id="mLearn" aria-pressed="true">לומדים</button>
      <button id="mPlay" aria-pressed="false">משחקים</button>
    </div>
  </header>

  <section id="learn">
    <div class="stage">
      <button class="arrow" id="prev" aria-label="הקודם">◀</button>
      <div class="sticker" id="pic" aria-hidden="true"></div>
      <button class="arrow" id="next" aria-label="הבא">▶</button>
    </div>
    <button class="blocks" id="word" aria-label="הקשיבו למילה"></button>
    <p class="he" id="he"></p>
    <div class="ask"><button class="say en" id="say">🔊 Listen</button></div>
    <p class="count" id="count"></p>
  </section>

  <section id="play" class="hide">
    <div class="ask"><button class="say en" id="again">🔊 Listen</button></div>
    <p class="msg" id="msg">Tap the right picture!</p>
    <div class="opts" id="opts"></div>
    <div class="stars" id="stars" aria-live="polite"></div>
  </section>

  <p class="tip">טיפ להורים: ההשמעה פועלת דרך הדפדפן. אם אין צליל, בדקו שהמכשיר לא על מצב שקט.</p>
</main>
<nav id="tabs" aria-label="נושאים"></nav>

<script>
const T={
  animals:{label:"חיות",icon:"🐶",items:[["dog","🐶","כלב"],["cat","🐱","חתול"],["fish","🐟","דג"],["bird","🐦","ציפור"],["cow","🐮","פרה"],["horse","🐴","סוס"],["lion","🦁","אריה"],["duck","🦆","ברווז"]]},
  colors:{label:"צבעים",icon:"🎨",kind:"color",items:[["red","#e63946","אדום"],["blue","#3a86ff","כחול"],["green","#22a96b","ירוק"],["yellow","#ffd23f","צהוב"],["orange","#ff922b","כתום"],["purple","#8e5bd6","סגול"]]},
  numbers:{label:"מספרים",icon:"🔢",kind:"num",items:[["one","1","אחד"],["two","2","שניים"],["three","3","שלושה"],["four","4","ארבעה"],["five","5","חמישה"],["six","6","שישה"],["seven","7","שבעה"],["eight","8","שמונה"],["nine","9","תשעה"],["ten","10","עשרה"]]},
  fruits:{label:"פירות",icon:"🍎",items:[["apple","🍎","תפוח"],["banana","🍌","בננה"],["grapes","🍇","ענבים"],["orange","🍊","תפוז"],["watermelon","🍉","אבטיח"],["strawberry","🍓","תות"],["lemon","🍋","לימון"],["pear","🍐","אגס"]]}
};
let topic="animals",idx=0,stars=0,target=null,locked=false;
const $=id=>document.getElementById(id);
const speak=t=>{try{speechSynthesis.cancel();const u=new SpeechSynthesisUtterance(t);u.lang="en-US";u.rate=.8;u.pitch=1.1;speechSynthesis.speak(u)}catch(e){}};
const face=it=>T[topic].kind==="color"?`<span class="dot" style="background:${it[1]}"></span>`:T[topic].kind==="num"?`<span class="digit">${it[1]}</span>`:it[1];

function renderTabs(){
  $("tabs").innerHTML=Object.keys(T).map(k=>`<button data-k="${k}" aria-pressed="${k===topic}"><b>${T[k].icon}</b>${T[k].label}</button>`).join("");
  document.querySelectorAll("#tabs button").forEach(b=>b.onclick=()=>{
    topic=b.dataset.k;idx=0;document.body.dataset.topic=topic;renderTabs();renderCard();
    if(!$("play").classList.contains("hide"))newRound();
  });
}
function renderCard(){
  const items=T[topic].items,it=items[idx],p=$("pic");
  p.innerHTML=face(it);
  p.classList.remove("pop");void p.offsetWidth;p.classList.add("pop");
  $("word").innerHTML=[...it[0]].map(c=>`<span>${c}</span>`).join("");
  $("he").textContent=it[2];
  $("count").textContent=(idx+1)+" / "+items.length;
}
function go(d){const n=T[topic].items.length;idx=(idx+d+n)%n;renderCard();speak(T[topic].items[idx][0])}
function renderStars(){$("stars").innerHTML=[0,1,2,3,4].map(i=>`<i class="${i<stars?"on":""}">⭐</i>`).join("")}
function newRound(){
  const pool=[...T[topic].items].sort(()=>Math.random()-.5).slice(0,3);
  target=pool[Math.floor(Math.random()*3)];locked=false;
  $("msg").textContent="Tap the right picture!";
  $("opts").innerHTML=pool.map(it=>`<button class="opt" data-w="${it[0]}" aria-label="${it[0]}">${face(it)}</button>`).join("");
  document.querySelectorAll(".opt").forEach(b=>b.onclick=()=>pick(b));
  setTimeout(()=>speak(target[0]),250);
}
function pick(b){
  if(locked)return;
  if(b.dataset.w===target[0]){
    locked=true;b.classList.add("ok");stars++;
    const full=stars>=5;
    $("msg").textContent=full?"Super star! 🌟":"Great job! 🎉";
    speak(full?"Super star!":"Great job! "+target[0]);
    renderStars();
    setTimeout(()=>{if(full){stars=0;renderStars()}newRound()},1900);
  }else{
    b.classList.remove("no");void b.offsetWidth;b.classList.add("no");
    $("msg").textContent="Try again! 💪";speak("Try again");
  }
}
function setMode(play){
  $("learn").classList.toggle("hide",play);$("play").classList.toggle("hide",!play);
  $("mLearn").setAttribute("aria-pressed",!play);$("mPlay").setAttribute("aria-pressed",play);
  if(play){renderStars();newRound()}
}
$("say").onclick=$("word").onclick=()=>speak(T[topic].items[idx][0]);
$("again").onclick=()=>target&&speak(target[0]);
$("next").onclick=()=>go(1);$("prev").onclick=()=>go(-1);
$("mLearn").onclick=()=>setMode(false);$("mPlay").onclick=()=>setMode(true);
renderTabs();renderCard();
</script>
